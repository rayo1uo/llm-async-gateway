x-gateway-env: &gateway-env
  REDIS_ADDR: redis:6379
  UPSTREAM_URL: http://mockupstream:8090
  LOG_LEVEL: info
  POLL_INTERVAL: 50ms
  MAX_CONCURRENCY: "4"
  RESERVED_BATCH_SLOTS: "1"
  BATCH_ENQUEUE_WINDOW: "16"
  BATCH_RESERVE_EVERY: "5"
  AGING_SLACK: 2m
  DEFAULT_COMPLETION_WINDOW: 24h
  DEFAULT_NEARLINE_DEADLINE: 2m
  LEASE_TTL: 30s
  CONTROLLER_LOCK_TTL: 10s
  GATES: local
  POOL: default
  KEY_PREFIX: lag

x-depends: &depends
  depends_on:
    redis:
      condition: service_healthy
    mockupstream:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  mockupstream:
    build: .
    command: ["mockupstream", "-addr", ":8090", "-delay", "30ms"]
    ports:
      - "8090:8090"

  gateway-api-1:
    build: .
    command: ["gateway-api"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8080:8080"
    <<: *depends

  gateway-api-2:
    build: .
    command: ["gateway-api"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8081:8080"
    <<: *depends

  dispatcher-1:
    build: .
    command: ["dispatcher"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8082:8080"
    <<: *depends

  dispatcher-2:
    build: .
    command: ["dispatcher"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8083:8080"
    <<: *depends

  batch-controller:
    build: .
    command: ["batch-controller"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8084:8080"
    <<: *depends

  batch-controller-standby:
    build: .
    command: ["batch-controller"]
    environment:
      <<: *gateway-env
      GATEWAY_ADDR: ":8080"
    ports:
      - "8085:8080"
    <<: *depends
